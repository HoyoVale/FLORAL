# FLORAL requested configuration authority.
# Secrets remain in .env or the inherited process environment.
# Phase 4.0E2 adopts the unified Codex renderer in production. Phase 4.0E3
# projects MCP registration from the canonical typed registry, and Phase 4.0E4
# adopts QQ SDK constructor, session, and delivery options.

schema_version = 1
profile = "production"

[floral]
node_env = "development"
host = "127.0.0.1"
port = 8787
log_level = "info"
data_dir = "./data"
database_path = "./data/floral.sqlite"
instance_lock_path = "./data/floral.lock"
service_state_path = "./data/service-state.json"
service_mode = "foreground"
mock_trust_owner = true

[qq]
mode = "mock"
session_dir = "./data/qq-session"
startup_timeout_ms = 30000
reply_target_ttl_ms = 240000
reply_target_cache_entries = 256
text_chunk_characters = 1800
max_reply_chunks = 4
outbound_timeout_ms = 30000
probe_timeout_ms = 120000
full_chain_timeout_ms = 300000
reconnect_probe_timeout_ms = 300000

[qq.sdk]
# Pinned installed SDK contract; secrets remain environment-only.
expected_version = "1.0.4"
account_id_strategy = "sha256-app-id"
session_persistence = "file"
token_prefetch = "sync"
logger = "redacted"

[codex]
mode = "mock"
command = "codex"
args = ["app-server"]
model = ""
cwd = "."
managed_home = "./data/codex-runtime"
request_timeout_ms = 120000
# Locked until the permission authority is implemented.
native_web_search = false

[codex.sandbox]
# Locked Phase 4.0 safety baseline.
mode = "read-only"

[codex.approval]
# Locked Phase 4.0 safety baseline.
policy = "never"

[codex.native]
# Native Codex config.toml fields. "inherit" maps DeepSeek high/max to
# Codex high/xhigh. Provider identity and web-search policy remain locked.
provider_id = "floral-deepseek"
wire_api = "responses"
reasoning_effort = "inherit"
reasoning_summary = "auto"
web_search = "disabled"
request_max_retries = 0
stream_max_retries = 0
supports_websockets = false

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
request_timeout_ms = 120000
thinking = "enabled"
reasoning_effort = "high"
prestream_max_attempts = 2
retry_base_delay_ms = 250
retry_max_delay_ms = 2000

[bridge]
host = "127.0.0.1"
port = 8790
max_body_bytes = 4194304
max_concurrent_requests = 4
max_queued_requests = 8
queue_timeout_ms = 15000

[search]
service_url = "http://127.0.0.1:8888"
request_timeout_ms = 15000

[search.container]
# Native container runtime surface. The host bind and image digest are locked.
image = "docker.io/searxng/searxng@sha256:02aa607ecc87165ebe6212476a176b8984d891c01a2d130ad03a58109d13db77"
container_name = "floral-searxng"
restart = "unless-stopped"
host_bind_address = "127.0.0.1"
host_port = 8888
stop_grace_period_sec = 20
health_interval_sec = 30
health_timeout_sec = 7
health_retries = 3
health_start_period_sec = 20

[search.settings]
# Native SearXNG settings.yml surface currently managed by FLORAL.
use_default_settings = true
instance_name = "FLORAL Search"
safe_search = 1
autocomplete = ""
default_lang = "auto"
formats = ["html", "json"]
internal_port = 8080
bind_address = "0.0.0.0"
limiter = false
public_instance = false
image_proxy = false
method = "GET"
outgoing_request_timeout_ms = 5000
outgoing_max_request_timeout_ms = 10000
enable_http2 = true

[auth]
mode = "local"
better_auth_url = "http://127.0.0.1:8787"
# Locked until the web administration security phase.
email_password_enabled = false

[runtime.adoption.codex]
# Phase 4.0E2 installs the unified Codex config after a compatible shadow
# report has been observed. Runtime startup automatically retries once with
# the saved legacy config if unified startup or adoption recording fails.
# Set to "unified-shadow" to return to observation-only mode, or "legacy" for
# emergency rollback to the established generator.
mode = "unified"

[runtime.adoption.qq_sdk]
# Phase 4.0E4 builds QQ SDK constructor, session persistence, and delivery
# options from the unified authority. "legacy" remains an emergency fallback.
mode = "unified"

[runtime.adoption.searxng]
# Phase 4.0E5 prepares SearXNG settings from the unified authority, verifies
# the reviewed image digest, observes /config after startup, and falls back to
# the checked-in infrastructure template if unified preparation fails.
mode = "unified"

[runtime.authorization]
# Phase 5.2 authorization authority. Remote approvals are one-shot, owner and
# conversation scoped, expire quickly, and are invalidated by service restart.
enabled = true
approval_ttl_ms = 60000
max_pending_approvals = 8
owner_only_remote_approval = true

[runtime.cost_guard]
# Phase 5.1 fail-closed protection against runaway provider loops. Request and
# token limits use rolling windows. Pricing is an operator-reviewed estimate;
# DeepSeek remains the billing authority.
enabled = true
state_path = "./data/cost-guard/deepseek.json"
max_requests_per_minute = 20
max_requests_per_hour = 120
max_requests_per_day = 1000
max_tokens_per_hour = 5000000
max_tokens_per_day = 20000000
max_cost_cny_per_hour = 2
max_cost_cny_per_day = 10
duplicate_window_ms = 300000
duplicate_max_attempts = 4
max_unknown_usage_per_hour = 8

[runtime.cost_guard.pricing]
# Reviewed against the DeepSeek V4 Flash pricing page on 2026-08-07.
model = "deepseek-v4-flash"
input_cache_hit_cny_per_million = 0.02
input_cache_miss_cny_per_million = 1
output_cny_per_million = 2

[macos]
mode = "mock"
peekaboo_command = "peekaboo"

[mcp.search]
enabled = true
id = "floral_search"
package = "mcp-searxng@1.0.3"
command = "npx"
command_args = ["-y"]
no_proxy = "127.0.0.1,localhost,::1"
enabled_tools = ["searxng_web_search"]
required = true
startup_timeout_sec = 60
tool_timeout_sec = 45
default_tools_approval_mode = "approve"
tool_approval_mode = "approve"
inherit_parent_environment = false

[mcp.vision]
enabled = false
id = "floral_vision"
enabled_tools = ["vision_analyze_screen", "vision_analyze_region"]
inherit_parent_environment = false

[mcp.macos]
enabled = false
id = "floral_peekaboo"
profile = "observe"
enabled_tools = ["image", "see"]
inherit_parent_environment = false
